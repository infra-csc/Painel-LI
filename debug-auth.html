<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth</title>
</head>
<body>
    <h1>Debug Authentication</h1>
    <button onclick="checkLocalStorage()">Check localStorage</button>
    <button onclick="testEventCreation()">Test Event Creation</button>
    <div id="output"></div>

    <script>
        function checkLocalStorage() {
            const user = localStorage.getItem('auth-user');
            const output = document.getElementById('output');
            output.innerHTML = `<h3>localStorage 'auth-user':</h3><pre>${user}</pre>`;
            
            if (user) {
                try {
                    const parsed = JSON.parse(user);
                    output.innerHTML += `<h3>Parsed user:</h3><pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                    output.innerHTML += `<h3>User ID:</h3><pre>${parsed.id}</pre>`;
                } catch (e) {
                    output.innerHTML += `<h3>Error parsing JSON:</h3><pre>${e.message}</pre>`;
                }
            }
        }

        async function testEventCreation() {
            const user = localStorage.getItem('auth-user');
            let userId = null;
            
            if (user) {
                try {
                    userId = JSON.parse(user).id;
                } catch (e) {
                    console.error('Error parsing user from localStorage:', e);
                }
            }
            
            const headers = { "Content-Type": "application/json" };
            if (userId) {
                headers['user-id'] = userId;
            }
            
            const testData = {
                name: "Test Event",
                location: "Test Location", 
                startDate: "2025-09-26",
                endDate: "2025-09-27",
                observations: "Test"
            };
            
            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(testData),
                    credentials: 'include'
                });
                
                const output = document.getElementById('output');
                output.innerHTML = `<h3>Request Headers:</h3><pre>${JSON.stringify(headers, null, 2)}</pre>`;
                output.innerHTML += `<h3>Response Status:</h3><pre>${response.status}</pre>`;
                
                const result = await response.text();
                output.innerHTML += `<h3>Response Body:</h3><pre>${result}</pre>`;
                
            } catch (error) {
                const output = document.getElementById('output');
                output.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
